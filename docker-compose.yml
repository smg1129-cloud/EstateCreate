version: '3.8'

# Local development only. In production this maps to AWS RDS for
# PostgreSQL (HIPAA-eligible with a signed BAA) — see COMPLIANCE.md.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: telehealth
      POSTGRES_PASSWORD: telehealth_dev_password
      POSTGRES_DB: telehealth_clinic
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
